# Production-Grade Nginx Configuration for Distributed WebSocket Clustering
# Supports Sticky Sessions via IP Hashing and HTTP/1.1 Upgrade Protocol
# Optimized for low latency with connection pooling and compression

events {
    worker_connections 4096;
    use epoll; # Linux-specific high-performance event loop
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Gzip compression for all responses (reduces payload size 60-80%)
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;
    gzip_min_length 1000;
    gzip_comp_level 6;
    gzip_vary on;

    # Optimization: Sendfile and TCP settings for minimum latency transport
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Log format for performance analysis
    log_format latency '$remote_addr - $remote_user [$time_local] '
                       '"$request" $status $body_bytes_sent '
                       '"$http_referer" "$http_user_agent" '
                       'rt=$request_time uct="$upstream_connect_time" '
                       'uht="$upstream_header_time" urt="$upstream_response_time"';

    # Upstream pool of horizontally scaled game server instances
    upstream game_cluster {
        # Enable Sticky Sessions via Client IP Hashing.
        # This guarantees client WebSocket handshakes and subsequent polling packets
        # map deterministically to the same server node instance, avoiding unnecessary fallback layer switching.
        ip_hash; 

        # Define cluster nodes using internal Docker Compose service hostnames
        server game-node-1:4000 max_fails=3 fail_timeout=10s weight=1;
        server game-node-2:4000 max_fails=3 fail_timeout=10s weight=1;
        
        # Keepalive persistent socket connection pool cache (reduces handshake overhead)
        keepalive 64;
        keepalive_requests 1000;
        keepalive_timeout 60s;
    }

    server {
        listen 80;
        server_name localhost cardclash.internal;

        # Access and error logging with latency metrics
        access_log /var/log/nginx/cardclash_access.log latency buffer=32k flush=5s;
        error_log /var/log/nginx/cardclash_error.log warn;

        # WebSocket & API Gateway router routing rules
        location / {
            proxy_pass http://game_cluster;
            
            # CRITICAL WEB-SOCKET REQUIREMENTS: Enforce HTTP/1.1 Upgrade parameters
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Preserve Original client handshake request context attributes
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Optimized read/write streaming connection timeouts
            proxy_read_timeout 86400s; # Keep long-lived socket sessions un-terminated
            proxy_send_timeout 86400s;
            proxy_connect_timeout 10s;

            # Disable upstream buffering for real-time WebSocket updates
            proxy_buffering off;
            proxy_request_buffering off;

            # Buffer tuning to accelerate real-time binary synchronization frames
            proxy_buffers 8 32k;
            proxy_buffer_size 64k;
        }

        # Health check endpoint for load balancer awareness
        location /health {
            proxy_pass http://game_cluster;
            access_log off;
            proxy_connect_timeout 5s;
            proxy_read_timeout 5s;
        }
    }
}
